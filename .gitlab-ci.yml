# GitLab CI — the same gate as .github/workflows/test.yml (the repo lives on GitLab, so the
# GitHub workflows never run here), plus the scheduled backup from backup.yml.
#
# Pipelines run on merge requests, on pushes to main, and on schedules. A schedule (or a
# manual run) with BACKUP_ENV set (prod · staging · dev) runs ONLY the backup job.
# Deploys stay manual (`pnpm deploy:*` runs `pnpm verify` first for staging/prod).
#
# CI/CD variables (Settings → CI/CD → Variables; mask + protect the secrets):
#   build · e2e · csp : NEXT_PUBLIC_SITE_URL, NEXT_PUBLIC_CDN_URL, NEXT_PUBLIC_SANITY_PROJECT_ID,
#                       NEXT_PUBLIC_SANITY_DATASET, NEXT_PUBLIC_SANITY_API_VERSION
#   build · e2e · csp : SANITY_API_READ_TOKEN (Viewer, read-only). e2e · csp blank the write token:
#                       nothing in CI writes to Sanity (the seed runs locally: `pnpm seed:e2e`)
#   auth journeys     : E2E_CLERK_PUBLISHABLE_KEY, E2E_CLERK_SECRET_KEY, E2E_CLERK_ADMIN_EMAIL
#                       (a Clerk TEST instance; unset → those journeys skip)
#   backup            : CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, SANITY_API_READ_TOKEN,
#                       NEXT_PUBLIC_SANITY_PROJECT_ID, NEXT_PUBLIC_SANITY_DATASET

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages: [check, build, browser, scheduled]

variables:
  PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.62.1-noble # matches @playwright/test

# Node 22 + pnpm (corepack reads `packageManager`) + a frozen install, cached per lockfile.
.pnpm:
  image: node:22-bookworm
  interruptible: true
  cache:
    key:
      files: [pnpm-lock.yaml]
    paths: [.pnpm-store]
  before_script:
    - corepack enable
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" || $BACKUP_ENV # a backup run is backup only
      when: never
    - when: on_success

.browser:
  extends: .pnpm
  image: $PLAYWRIGHT_IMAGE
  stage: browser

# Types + lint + format + contrast + unit tests + coverage floors + tooling gates. BLOCKING.
verify:
  extends: .pnpm
  stage: check
  script:
    - pnpm tsc
    - pnpm lint
    - pnpm format:check
    - pnpm --filter @indiecrafts/web-surfaces-website verify:contrast
    - pnpm check:tags
    - pnpm lint:scripts
    - pnpm test:scripts
    - pnpm test
    # Coverage floors (vitest.shared.ts). The three Workers have no v8 coverage (no node:inspector).
    - pnpm exec turbo run test --concurrency=50% --filter='!@indiecrafts/shared-api' --filter='!@indiecrafts/shared-cron' --filter='!@indiecrafts/shared-workers' -- --coverage --coverage.reporter=text-summary
    - pnpm check:api-guards
    - pnpm check:typed-routing
    - pnpm tokens:check
    - pnpm brands:check
    - pnpm check:tasks
    - pnpm check:secret-leak
    - pnpm check:placeholders # report-only (always exits 0)
    - pnpm check:lint-no-types
    - pnpm check:doc-coverage
    - pnpm check:claude-md

# Terraform fmt · validate · mocked plan per env for every stack. No Cloudflare token needed.
infra:
  extends: .pnpm
  stage: check
  before_script:
    - apt-get update -qq && apt-get install -y -qq unzip >/dev/null
    - curl -fsSL -o /tmp/tf.zip https://releases.hashicorp.com/terraform/1.16.4/terraform_1.16.4_linux_amd64.zip
    - unzip -q /tmp/tf.zip -d /usr/local/bin
  script:
    - node code/shared/scripts/checks/infra.mjs

# `wrangler deploy --dry-run` for every worker-cf service in the registry.
wrangler:
  extends: .pnpm
  stage: check
  script:
    - |
      node code/shared/scripts/lib/apps.mjs --class worker-cf --kind service |
      while IFS=$'\t' read -r slug _ pkg; do
        echo "── $slug ──"
        pnpm --filter "$pkg" exec wrangler deploy --dry-run --outdir "/tmp/$slug-dryrun"
      done

docs:
  extends: .pnpm
  stage: check
  script:
    - pnpm docs:install
    - pnpm docs:build

# Leaked secrets in the pushed commits (MR range, or the push range on main).
secrets-scan:
  stage: check
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  variables:
    GIT_DEPTH: 0
  script:
    - BASE="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-$CI_COMMIT_BEFORE_SHA}"
    - if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then RANGE="-1"; else RANGE="$BASE..$CI_COMMIT_SHA"; fi
    - gitleaks git --redact --verbose --log-opts="$RANGE" .
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" || $BACKUP_ENV # a backup run is backup only
      when: never
    - when: on_success

# The real OpenNext Worker build for every affected Next app + the landing-route JS budget.
build:
  extends: .pnpm
  stage: build
  variables:
    GIT_DEPTH: 0 # turbo --affected diffs against the base commit
  script:
    - BASE="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-$CI_COMMIT_BEFORE_SHA}"
    - if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ]; then export TURBO_SCM_BASE="$BASE"; fi
    - pnpm exec turbo run build:cf --affected
    - pnpm --filter @indiecrafts/web-surfaces-website size --enforce

# Every Storybook story as a component + a11y test; the gallery must build. BLOCKING.
browser-stories:
  extends: .browser
  script:
    - pnpm test:stories
    - pnpm --filter @indiecrafts/web-tools-storybook storybook:build
    - pnpm --filter @indiecrafts/web-tools-storybook test:stories:website

# Functional journeys: website (the seeded `tests-e2e` dataset), app, admin. Auth journeys skip
# without the Clerk test keys. BLOCKING. Read-only: the journeys stub every form POST and the
# seed runs on a developer's machine (`pnpm seed:e2e`) — a Sanity token works on every dataset of
# the project. Project-level variables reach every job, so blank the write token here.
browser-e2e-app:
  extends: .browser
  variables:
    NEXT_PUBLIC_SANITY_API_VERSION: "2025-01-01"
    E2E_SANITY_DATASET: tests-e2e
    E2E_SKIP_SEED: "1"
    SANITY_API_WRITE_TOKEN: ""
  script:
    - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY="$E2E_CLERK_PUBLISHABLE_KEY" CLERK_SECRET_KEY="$E2E_CLERK_SECRET_KEY" pnpm --filter @indiecrafts/web-surfaces-website e2e
    - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY="$E2E_CLERK_PUBLISHABLE_KEY" CLERK_SECRET_KEY="$E2E_CLERK_SECRET_KEY" pnpm --filter @indiecrafts/web-surfaces-app e2e
    - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY="$E2E_CLERK_PUBLISHABLE_KEY" CLERK_SECRET_KEY="$E2E_CLERK_SECRET_KEY" pnpm --filter @indiecrafts/web-surfaces-admin e2e

# The CSP-enforcement journey against a production build. BLOCKING.
csp:
  extends: .browser
  variables:
    E2E_TARGET: app
    NEXT_PUBLIC_SANITY_API_VERSION: "2025-01-01"
    E2E_SANITY_DATASET: tests-e2e
    E2E_SKIP_SEED: "1"
    SANITY_API_WRITE_TOKEN: ""
  script:
    - pnpm --filter @indiecrafts/web-surfaces-website exec playwright test journeys/csp-nonce.spec.ts

# Visual regression. ADVISORY until the linux baselines are committed: download the
# `visual-baselines-linux` artifact, commit it to e2e/visual.spec.ts-snapshots/, then
# drop allow_failure.
browser-e2e-visual:
  extends: .browser
  allow_failure: true
  script:
    - pnpm --filter @indiecrafts/web-tools-storybook storybook:build
    - pnpm --filter @indiecrafts/web-surfaces-website e2e:visual
  artifacts:
    when: always
    name: visual-baselines-linux
    paths: [code/projects/web/surfaces/website/e2e/visual.spec.ts-snapshots/]
    expire_in: 30 days

# Daily backup: every db in the registry (Sanity + both D1s) → that env's R2 bucket.
# Runs from a pipeline schedule (Build → Pipeline schedules, e.g. `0 3 * * *` UTC) with
# BACKUP_ENV set, or by hand ("Run pipeline" with BACKUP_ENV).
backup:
  extends: .pnpm
  stage: scheduled
  interruptible: false
  resource_group: backup-$BACKUP_ENV
  script:
    - KIND=""; [ "$CI_PIPELINE_SOURCE" = "schedule" ] && KIND="--kind=scheduled"
    - node code/shared/scripts/data/backup.mjs --all "$BACKUP_ENV" --remote $KIND
  rules:
    - if: ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web") && $BACKUP_ENV =~ /^(prod|staging|dev)$/
