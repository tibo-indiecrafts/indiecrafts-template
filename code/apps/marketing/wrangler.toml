# Cloudflare Workers config for the marketing Next app (via OpenNext).
# Deploy: `pnpm deploy:marketing:<env>` → scripts/deploy.mjs → `build:cf` (OpenNext)
# then `wrangler deploy --env <env>`. `pnpm project:rename <slug>` rewrites the names.

name = "indiecrafts-marketing-dev"
main = ".open-next/worker.js"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]
keep_vars = true

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[observability.logs]
enabled = true
invocation_logs = true

# ISR cache (uncomment + create the buckets like the web app):
# [[r2_buckets]]
# binding = "NEXT_INC_CACHE_R2_BUCKET"
# bucket_name = "indiecrafts-marketing-isr-dev"

[env.dev]
name = "indiecrafts-marketing-dev"

[env.staging]
name = "indiecrafts-marketing-staging"

[env.prod]
name = "indiecrafts-marketing-prod"
