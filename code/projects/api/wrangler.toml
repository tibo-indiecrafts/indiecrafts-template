# Cloudflare Worker — HTTP API (a BARE worker, no Next/OpenNext).
# Deploy: `pnpm deploy:api:<env>` (→ scripts/deploy.mjs → `wrangler deploy --env <env>`).
# Wrangler/esbuild bundles src/index.ts + its `@indiecrafts/*` imports — no build step.
#
# Per client site, `pnpm project:rename <slug>` rewrites every `indiecrafts-api`
# name here. Do NOT hand-edit the names (a staging/prod deploy is blocked until they
# differ from the template default — shared-account clobber guard, scripts/deploy.mjs).

name = "indiecrafts-api-dev"
main = "src/index.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]
# Keep dashboard-set vars/secrets on deploy (don't wipe `wrangler secret put`).
keep_vars = true

[observability.logs]
enabled = true
invocation_logs = true

# ── Optional bindings (uncomment as needed) ──────────────────
# [[kv_namespaces]]   binding = "KV"      id = "<wrangler kv namespace create>"
# [[r2_buckets]]      binding = "BUCKET"  bucket_name = "indiecrafts-api-<env>"
# [[d1_databases]]    binding = "DB"      database_name = "…"  database_id = "…"  migrations_dir = "../../db/migrations"
#
# To let the web app CALL this API in-process (no public hop), add a service
# binding to the WEB app's wrangler.toml (not here):
#   [[services]]  binding = "API"  service = "indiecrafts-api-<env>"

# ── per-env (mirror the deploy scripts) ──────────────────────
[env.dev]
name = "indiecrafts-api-dev"

[env.staging]
name = "indiecrafts-api-staging"

[env.prod]
name = "indiecrafts-api-prod"
