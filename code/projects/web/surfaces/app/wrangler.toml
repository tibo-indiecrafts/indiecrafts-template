# Cloudflare Workers config for the app Next surface (via OpenNext).
# Deploy: `pnpm deploy:app:<env>`. `pnpm project:rename <slug>` rewrites the names.

name = "indiecrafts-dev-web-surfaces-app"
main = ".open-next/worker.js"
compatibility_date = "2025-03-01"
# global_fetch_strictly_public: server calls to the api go over the public internet. Without
# it, a fetch to another Worker on the same zone (every *.workers.dev Worker of the account)
# fails with error 1042 — no consent log, CSP report, data request or admin read reached it.
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
keep_vars = true

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Observability (logs · traces · issues) — every env inherits this block. Never add an
# [env.<name>.observability] block: it replaces this one. View: dashboard → Worker → Observability.
[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

# Traces: sampled — every request is still in the logs above.
# ponytail: 10% of requests; raise to 1 on a low-traffic site, lower on a busy one.
[observability.traces]
enabled = true
head_sampling_rate = 0.1

# Issues: groups production errors (dashboard → Worker → Issues). Needs Wrangler ≥ 4.134.
[observability.issues]
enabled = true

[env.dev]
name = "indiecrafts-dev-web-surfaces-app"

# Per-env origins. The deploy bakes them into the browser bundle (NEXT_PUBLIC_API_URL from
# API_URL) — never .env.local's localhost. Prod: the api comes from the domain registry;
# set NEXT_PUBLIC_WEBSITE_URL under [env.prod.vars] once the website has its host.
[env.dev.vars]
API_URL = "https://indiecrafts-dev-shared-api.thibault-montaufray.workers.dev"
NEXT_PUBLIC_WEBSITE_URL = "https://indiecrafts-dev-web-surfaces-website.thibault-montaufray.workers.dev"

[env.staging]
name = "indiecrafts-staging-web-surfaces-app"

[env.staging.vars]
API_URL = "https://indiecrafts-staging-shared-api.thibault-montaufray.workers.dev"
NEXT_PUBLIC_WEBSITE_URL = "https://indiecrafts-staging-web-surfaces-website.thibault-montaufray.workers.dev"

[env.prod]
name = "indiecrafts-prod-web-surfaces-app"
