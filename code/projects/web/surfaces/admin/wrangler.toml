# Cloudflare Workers config for the admin Next app (via OpenNext).
# Deploy: `pnpm deploy:admin:<env>`. Internal/auth-gated — put it on a private
# subdomain + Cloudflare Access. `pnpm project:rename <slug>` rewrites the names.

name = "indiecrafts-dev-web-surfaces-admin"
main = ".open-next/worker.js"
compatibility_date = "2025-03-01"
# global_fetch_strictly_public: server calls to the api go over the public internet. Without
# it, a fetch to another Worker on the same zone (every *.workers.dev Worker of the account)
# fails with error 1042 — no consent log, CSP report, data request or admin read reached it.
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
keep_vars = true
# No esbuild `__name(...)` helper calls in the bundle: next-themes injects its no-flash theme
# script with `Function.toString()`, and a helper call inside it throws in the browser
# ("__name is not defined") before the script sets the theme.
keep_names = false

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Observability (logs · traces · issues) — every env inherits this block. Never add an
# [env.<name>.observability] block: it replaces this one. View: dashboard → Worker → Observability.
[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

# Traces: sampled — every request is still in the logs above.
# ponytail: 10% of requests; raise to 1 on a low-traffic site, lower on a busy one.
[observability.traces]
enabled = true
head_sampling_rate = 0.1

# Issues: groups production errors (dashboard → Worker → Issues). Needs Wrangler ≥ 4.134.
[observability.issues]
enabled = true

[env.dev]
name = "indiecrafts-dev-web-surfaces-admin"

[env.dev.vars]
# Per-env origins (config, not secrets — the secret sync skips keys set here). The System
# page probes WEBSITE_URL / APP_URL.
API_URL = "https://indiecrafts-dev-shared-api.thibault-montaufray.workers.dev"
WEBSITE_URL = "https://indiecrafts-dev-web-surfaces-website.thibault-montaufray.workers.dev"
APP_URL = "https://indiecrafts-dev-web-surfaces-app.thibault-montaufray.workers.dev"

[env.staging]
name = "indiecrafts-staging-web-surfaces-admin"
# Staging still runs on workers.dev. When its Access host goes live (zone_id + domain in
# infra/cloudflare/env/staging.tfvars), set workers_dev + preview_urls = false here, as prod
# does: wrangler-parity.test.mjs fails until you do.

[env.staging.vars]
# Per-env origins (config, not secrets — the secret sync skips keys set here). The System
# page probes WEBSITE_URL / APP_URL.
API_URL = "https://indiecrafts-staging-shared-api.thibault-montaufray.workers.dev"
WEBSITE_URL = "https://indiecrafts-staging-web-surfaces-website.thibault-montaufray.workers.dev"
APP_URL = "https://indiecrafts-staging-web-surfaces-app.thibault-montaufray.workers.dev"

[env.prod]
name = "indiecrafts-prod-web-surfaces-admin"
# Only the Access-gated host serves prod: a workers.dev or preview URL skips Cloudflare Access.
workers_dev = false
preview_urls = false

