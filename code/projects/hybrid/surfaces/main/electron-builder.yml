# electron-builder — packages the app into installers (.dmg / .exe / .AppImage) and
# publishes them (+ the auto-update feed) to Cloudflare R2. Deploy = ship these artifacts.
# Per client, rename appId + productName (extend `project:rename` to cover them).
appId: dev.indiecrafts.hybrid
productName: indiecrafts
directories:
  output: release
  buildResources: build-resources # build/ is gitignored repo-wide; source config lives here
files:
  # electron-vite builds to out/ (see electron.vite.config.ts + package.json main).
  - out/**

# ── Code signing + notarization ────────────────────────────────────────────────
# Credentials come from the ENV (never the repo), so a local build with none set is
# UNSIGNED (dev only) and notarization is skipped; CI with the secrets produces a
# signed + notarized artifact:
#   macOS   — CSC_LINK (Developer ID Application .p12, base64/URL) + CSC_KEY_PASSWORD;
#             notarize reads APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID.
#   Windows — CSC_LINK + CSC_KEY_PASSWORD (OV/EV cert), or Azure Trusted Signing.
mac:
  category: public.app-category.productivity
  target: [dmg]
  hardenedRuntime: true # required for notarization
  gatekeeperAssess: false
  entitlements: build-resources/entitlements.mac.plist
  entitlementsInherit: build-resources/entitlements.mac.plist
  notarize: true # skipped automatically when the build is unsigned (no Apple creds)
win:
  target: [nsis]
linux:
  target: [AppImage]

# ── Distribution + auto-update feed (Cloudflare R2, "generic" provider) ─────────
# CI uploads `release/*.{dmg,exe,AppImage,yml,blockmap}` to the R2 bucket
# `<prefix>-<env>-hybrid-surfaces-main-releases`, served at `downloads.<root>/hybrid`.
# electron-updater (src/main) checks this same URL. Set the host to your domain.
publish:
  provider: generic
  url: https://downloads.example.com/hybrid
  channel: latest
