# Cloudflare Worker — the AI agent (a BARE worker, no Next/OpenNext). The ONE dedicated
# agent endpoint for every surface (web · mobile · hybrid). Deploy: `pnpm deploy:agent:<env>`.
# Wrangler/esbuild bundles src/index.ts + its `@indiecrafts/*` imports — no build step.
#
# Names follow `<prefix>-<env>-<tail>` (`indiecrafts-<env>-shared-agent`), the single formula
# in scripts/lib/apps.mjs `resourceName`. `pnpm project:rename <slug>` swaps only `<prefix>`.
# Do NOT hand-edit the names (a staging/prod deploy is blocked until the prefix differs).

name = "indiecrafts-dev-shared-agent"
main = "src/index.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]
keep_vars = true

[observability.logs]
enabled = true
invocation_logs = true

# ── Rate limit (Cloudflare native binding) — per client IP; caps LLM spend/abuse ──
# namespace_id is a per-Worker logical id (any int ≥ 1000); no allocation needed.
# unsafe.bindings are NOT inherited by named environments → declared per env below
# (top-level here would be silently dropped on every `--env` deploy).

# ── Browser allowlist (the deployed website origin) — the browser auth path requires
# an allowlisted Origin + a Turnstile token. Comma-separate for multiple. localhost dev
# origins are built in. Set per env below. (Public value → a var, not a secret.) ──
# [vars]
# WEB_ORIGIN = "https://www.example.com"

# Secrets (NEVER here) → `wrangler secret put <NAME> --env <env>` (+ `.dev.vars` locally):
#   ANTHROPIC_API_KEY · APP_API_TOKEN · TURNSTILE_SECRET

# ── per-env (mirror the deploy scripts) ──────────────────────
[env.dev]
name = "indiecrafts-dev-shared-agent"
[[env.dev.unsafe.bindings]]
name = "AGENT_RATELIMIT"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[env.staging]
name = "indiecrafts-staging-shared-agent"
# [env.staging.vars]
# WEB_ORIGIN = "https://staging.example.com"
[[env.staging.unsafe.bindings]]
name = "AGENT_RATELIMIT"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[env.prod]
name = "indiecrafts-prod-shared-agent"
# [env.prod.vars]
# WEB_ORIGIN = "https://www.example.com"
[[env.prod.unsafe.bindings]]
name = "AGENT_RATELIMIT"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 20, period = 60 }
