# Cloudflare Worker — HTTP API (a BARE worker, no Next/OpenNext).
# Deploy: `pnpm deploy:api:<env>` (→ scripts/deploy/worker.mjs → `wrangler deploy --env <env>`).
# Wrangler/esbuild bundles src/index.ts + its `@indiecrafts/*` imports — no build step.
#
# Names follow `<prefix>-<env>-<platform>-<slug>` (here `indiecrafts-<env>-shared-api`),
# the single formula in scripts/lib/apps.mjs `resourceName`. `pnpm project:rename <slug>`
# swaps only the `<prefix>`. Do NOT hand-edit the names (a staging/prod deploy is blocked
# until the prefix differs from the template default — shared-account clobber guard).

name = "indiecrafts-dev-shared-api"
main = "src/index.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]
# Keep dashboard-set vars/secrets on deploy (don't wipe `wrangler secret put`).
keep_vars = true

# Observability (logs · traces · issues) — every env inherits this block. Never add an
# [env.<name>.observability] block: it replaces this one. View: dashboard → Worker → Observability.
[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

# Traces: sampled — every request is still in the logs above.
# ponytail: 10% of requests; raise to 1 on a low-traffic site, lower on a busy one.
[observability.traces]
enabled = true
head_sampling_rate = 0.1

# Issues: groups production errors (dashboard → Worker → Issues). Needs Wrangler ≥ 4.134.
[observability.issues]
enabled = true

# ═══════════════════════════════════════════════════════════════════════
# Bindings & runtime options — uncomment ONLY what this Worker needs.
# The blocks here are the BASE (used by `wrangler dev` + the default deploy);
# repeat each under `[env.<env>.*]` to differ per env (like the name lines).
# Bucket/DB names follow the resource scheme `indiecrafts-<env>-shared-api-<x>`.
# Full reference: https://developers.cloudflare.com/workers/wrangler/configuration/
# ═══════════════════════════════════════════════════════════════════════

# ── Plain vars (non-secret; visible in the dashboard) ────────────────────
# Sanity read config for GET /v1/announcements (PUBLIC marketing content — same as the
# website). PROJECT_ID + DATASET are public → safe here / in the dashboard; fill them per
# deployment (repeat under [env.<env>.vars] if the dataset differs per env). Until set, the
# route answers 503. SANITY_API_READ_TOKEN is a SECRET → `wrangler secret put
# SANITY_API_READ_TOKEN --env <env>` (needed only if the dataset is not public-read).
# Public vars go PER ENV under `[env.<env>.vars]` below — wrangler does NOT inherit a
# top-level `[vars]` into named environments (it warns + drops them), so there is no
# top-level `[vars]` block. The active base vars declared per env:
#   SANITY_API_VERSION = "2025-01-01"
#   BACKUP_BUCKET = "<prefix>-<env>-db-backup"   # informational (GET /v1/backups/status); env-specific
#   BACKUP_RETENTION_DAYS = "30"
# Optional vars to add per env as needed:
#   SANITY_PROJECT_ID / SANITY_DATASET / WEBSITE_URL (set on dev + staging; prod once its domain exists)
#   EMAIL_ADMIN_BCC = "admin@your-site.example"    # BCC'd on outbound (erasure) emails
#   SECURITY_ALERT_EMAIL = "soc@your-site.example" # high/critical alert; falls back to EMAIL_ADMIN_BCC
#   ALLOWED_ORIGINS = "http://localhost:5173"     # browser origins allowed to read bearer routes (comma-separated); unset → none
# Secrets are NEVER vars → `wrangler secret put <NAME> --env <env>` (or `pnpm secrets:sync:*`).

# ── KV — edge key-value (cache · sessions · flags) ───────────────────────
# [[kv_namespaces]]
# binding = "KV"                       # env.KV
# id = "<wrangler kv namespace create KV>"

# ── R2 — S3-compatible object storage ────────────────────────────────────
# [[r2_buckets]]
# binding = "BUCKET"                   # env.BUCKET
# bucket_name = "indiecrafts-dev-shared-api-assets"

# Data-export bundles (POST /v1/export → GET /v1/export/download). Operator-provisioned;
# uncomment + repeat under [env.<env>] once created:
#   wrangler r2 bucket create indiecrafts-dev-shared-api-exports
# [[r2_buckets]]
# binding = "EXPORT_BUCKET"            # env.EXPORT_BUCKET
# bucket_name = "indiecrafts-dev-shared-api-exports"

# ── D1 — serverless SQLite ───────────────────────────────────────────────
# [[d1_databases]]
# binding = "AUDIT_DB"                       # env.DB
# database_name = "indiecrafts-dev-db-audit"
# database_id = "<wrangler d1 create …>"
# migrations_dir = "db/d1/<name>/migrations"

# ── Queues — produce / consume (add a `queue()` handler to consume) ──────
# [[queues.producers]]
# binding = "JOBS"                     # env.JOBS.send(msg)
# queue = "indiecrafts-dev-jobs"
# [[queues.consumers]]
# queue = "indiecrafts-dev-jobs"
# max_batch_size = 10
# max_retries = 3
# dead_letter_queue = "indiecrafts-dev-jobs-dlq"

# ── Service binding — call a sibling Worker in-process (no public hop) ───
# [[services]]
# binding = "WORKERS"                  # env.WORKERS.fetch(req)
# service = "indiecrafts-dev-shared-workers"

# ── Durable Objects — strongly-consistent coordination ──────────────────
# [[durable_objects.bindings]]
# name = "COUNTER"                     # env.COUNTER
# class_name = "Counter"
# [[migrations]]
# tag = "v1"
# new_classes = ["Counter"]

# ── Data / AI / integration bindings (one line each — uncomment + fill) ──
# [ai]                            binding = "AI"                            # Workers AI
# --- Audit + session sink (POST /v1/events → EU D1) — native rate limit + secrets ------
# [[unsafe.bindings]]  name = "RATELIMIT"  type = "ratelimit"  namespace_id = "1001"  simple = { limit = 20, period = 60 }
# secrets (set out-of-band, never here): `wrangler secret put APP_API_TOKEN --env <env>` + `IP_HASH_SALT`
# [[vectorize]]                   binding = "VEC"       index_name = "…"    # vector search
# [[hyperdrive]]                  binding = "PG"        id = "<config id>"  # pooled Postgres
# [browser]                       binding = "BROWSER"                       # headless Chrome
# [[analytics_engine_datasets]]   binding = "AE"        dataset = "…"       # write-time analytics
# [[mtls_certificates]]           binding = "CLIENT_CERT"  certificate_id = "…"
# [[send_email]]                  name = "MAILER"                           # CF Email Routing send
# [version_metadata]              binding = "CF_VERSION"                    # deployed version id/tag

# ── Smart placement — run near your DB/backend, not the eyeball ──────────
# [placement]
# mode = "smart"

# ── Limits + source maps + tail ──────────────────────────────────────────
# [limits]
# cpu_ms = 50                          # raise for heavy requests (paid)
# upload_source_maps = true            # readable stack traces in Workers Logs
# [[tail_consumers]]
# service = "indiecrafts-dev-shared-workers"   # stream this Worker's logs elsewhere

# ── Local dev (`wrangler dev`) ───────────────────────────────────────────
# [dev]
# port = 8787
# local_protocol = "http"

# ── per-env (mirror the deploy scripts) ──────────────────────
# TWO EU D1s per env, both `--location weur` (create-time + immutable):
#   DB      — append-only telemetry firehose: admin_audit · session_events ·
#             security_events · csp_reports · backup_runs; retention-purged by `cron`.
#   MAIN_DB — identity/rights/settings: user_profiles · consent_events · data_requests ·
#             erasure_requests · export_requests · site_settings.
# Split so a firehose migration/write-spike can't threaten identity data. Create per env,
# then paste the returned `database_id`:
#   wrangler d1 create indiecrafts-dev-shared-api --location weur
#   wrangler d1 create indiecrafts-dev-db-main --location weur
# `SECURITY_COUNTERS` (KV) holds ephemeral failed-login counters (TTL) so rates are counted
# at the edge, never written per-request to D1:
#   wrangler kv namespace create indiecrafts-dev-shared-api-security-counters
# Secrets (out-of-band): APP_API_TOKEN · IP_HASH_SALT · CLERK_WEBHOOK_SECRET (Svix) ·
#   GDPR_FINGERPRINT_SALT (email pseudonymisation fingerprint; DISTINCT per env, generated
#   independently — STABLE within an env, never rotate a live one) ·
#   CLERK_SECRET_KEY (erasure route's real Clerk client) ·
#   SANITY_API_WRITE_TOKEN (erasure route's Sanity pseudonymisation writes) ·
#   EMAIL_PREF_SECRET (signs the no-login email-preferences token) ·
#   RESEND_WEBHOOK_SECRET (Svix; verifies POST /v1/resend/webhook) —
#   wrangler secret put <NAME> --env <env>
# Per-category Resend Topic wiring (each category's resendTopicId) is Sanity-configured, not
# a wrangler var — see the emailPreferences singleton in Studio. Contacts are global (Resend
# renamed Audiences to Segments), so there is no audience id to wire.
[env.dev]
name = "indiecrafts-dev-shared-api"

# CF native rate limiter (defence-in-depth behind the WAF /api/* rule). Applied to the
# public/token write paths in code via `if (env.RATELIMIT)`. Per-env namespace_id.
[[env.dev.unsafe.bindings]]
name = "RATELIMIT"
type = "ratelimit"
namespace_id = "2001"
simple = { limit = 20, period = 60 }

# vars are NOT inherited from the top level — declare them per env (wrangler warns otherwise).
[env.dev.vars]
# Security alerts (high/critical incidents) — the operator inbox; falls back to EMAIL_ADMIN_BCC.
SECURITY_ALERT_EMAIL = "support@indiecrafts.dev"
SANITY_API_VERSION = "2025-01-01"
# Sanity is one project + one dataset for the whole platform — identical in every env
# (the website reads the same NEXT_PUBLIC_SANITY_* values). Public, so [vars] not secrets.
SANITY_PROJECT_ID = "qy2pp5sn"
SANITY_DATASET = "production"
# Outbound email sender — one Resend-verified domain for every env. dev/staging serve on
# *.workers.dev but still send from this address (the sender is independent of the worker
# host). Requires updates.indiecrafts.dev verified in Resend before any email sends.
EMAIL_FROM = "no-reply@updates.indiecrafts.dev"
BACKUP_BUCKET = "indiecrafts-dev-db-backup"
# The website origin — the erasure email links to its /erasure/confirm page. Unset →
# the api's own confirm form (prod, until its custom domain is set in domains.mjs).
WEBSITE_URL = "https://indiecrafts-dev-web-surfaces-website.thibault-montaufray.workers.dev"
BACKUP_RETENTION_DAYS = "30"
# QA-only gate: honor the Studio-editable emailStrings.bccAll (blind-copy every email).
# dev ONLY — never set under [env.staging.vars]/[env.prod.vars], so a Studio editor can't
# silently blind-copy auth codes / magic links in production.
EMAIL_BCC_ALL_ENABLED = "true"

[[env.dev.d1_databases]]
binding = "AUDIT_DB"
database_name = "indiecrafts-dev-db-audit"
database_id = "13e4a91d-ede8-4102-8e9e-010034f6134c"
migrations_dir = "db/audit/migrations"

[[env.dev.d1_databases]]
binding = "MAIN_DB"
database_name = "indiecrafts-dev-db-main"
database_id = "280052ef-726d-43fb-9adb-4821da803627"
migrations_dir = "db/main/migrations"

[[env.dev.kv_namespaces]]
binding = "SECURITY_COUNTERS"
id = "03930e85db0243bc9c6f01553285f4ba"

[[env.dev.r2_buckets]]
binding = "EXPORT_BUCKET"
bucket_name = "indiecrafts-dev-shared-api-exports"

# "Run now" (admin → POST /v1/cron/run) calls the cron privately — the cron has no public URL.
# The cron must exist before this deploys (deploy:all deploys it first).
[[env.dev.services]]
binding = "CRON"
service = "indiecrafts-dev-shared-cron"


[env.staging]
name = "indiecrafts-staging-shared-api"

[[env.staging.unsafe.bindings]]
name = "RATELIMIT"
type = "ratelimit"
namespace_id = "3001"
simple = { limit = 20, period = 60 }

[env.staging.vars]
# Security alerts (high/critical incidents) — the operator inbox; falls back to EMAIL_ADMIN_BCC.
SECURITY_ALERT_EMAIL = "support@indiecrafts.dev"
SANITY_API_VERSION = "2025-01-01"
SANITY_PROJECT_ID = "qy2pp5sn"
SANITY_DATASET = "production"
EMAIL_FROM = "no-reply@updates.indiecrafts.dev"
BACKUP_BUCKET = "indiecrafts-staging-db-backup"
# The website origin — the erasure email links to its /erasure/confirm page. Unset →
# the api's own confirm form (prod, until its custom domain is set in domains.mjs).
WEBSITE_URL = "https://indiecrafts-staging-web-surfaces-website.thibault-montaufray.workers.dev"
BACKUP_RETENTION_DAYS = "30"

[[env.staging.d1_databases]]
binding = "AUDIT_DB"
database_name = "indiecrafts-staging-db-audit"
database_id = "PASTE_D1_ID_HERE"
migrations_dir = "db/audit/migrations"

[[env.staging.d1_databases]]
binding = "MAIN_DB"
database_name = "indiecrafts-staging-db-main"
database_id = "PASTE_CORE_D1_ID_HERE"
migrations_dir = "db/main/migrations"

[[env.staging.kv_namespaces]]
binding = "SECURITY_COUNTERS"
id = "PASTE_KV_ID_HERE"

# "Run now" (admin → POST /v1/cron/run) calls the cron privately — the cron has no public URL.
# The cron must exist before this deploys (deploy:all deploys it first).
[[env.staging.services]]
binding = "CRON"
service = "indiecrafts-staging-shared-cron"


[env.prod]
name = "indiecrafts-prod-shared-api"

[[env.prod.unsafe.bindings]]
name = "RATELIMIT"
type = "ratelimit"
namespace_id = "4001"
simple = { limit = 20, period = 60 }

[env.prod.vars]
# Security alerts (high/critical incidents) — the operator inbox; falls back to EMAIL_ADMIN_BCC.
SECURITY_ALERT_EMAIL = "support@indiecrafts.dev"
SANITY_API_VERSION = "2025-01-01"
SANITY_PROJECT_ID = "qy2pp5sn"
SANITY_DATASET = "production"
EMAIL_FROM = "no-reply@updates.indiecrafts.dev"
BACKUP_BUCKET = "indiecrafts-prod-db-backup"
BACKUP_RETENTION_DAYS = "30"

[[env.prod.d1_databases]]
binding = "AUDIT_DB"
database_name = "indiecrafts-prod-db-audit"
database_id = "PASTE_D1_ID_HERE"
migrations_dir = "db/audit/migrations"

[[env.prod.d1_databases]]
binding = "MAIN_DB"
database_name = "indiecrafts-prod-db-main"
database_id = "PASTE_CORE_D1_ID_HERE"
migrations_dir = "db/main/migrations"

[[env.prod.kv_namespaces]]
binding = "SECURITY_COUNTERS"
id = "PASTE_KV_ID_HERE"

# "Run now" (admin → POST /v1/cron/run) calls the cron privately — the cron has no public URL.
# The cron must exist before this deploys (deploy:all deploys it first).
[[env.prod.services]]
binding = "CRON"
service = "indiecrafts-prod-shared-cron"
