# Cloudflare Worker config for the background-jobs Worker (cron / queues / tasks).
# Deployed separately from the web app: `pnpm --filter @indiecrafts/shared-workers deploy:workers:<env>`.
# Per client, rename `indiecrafts-workers-*` (mirror the web app's `project:rename`).

name = "indiecrafts-dev-shared-workers"
main = "src/index.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]
keep_vars = true

# Cron schedule(s), UTC. Example: every day at 06:00. Edit or remove; the `scheduled`
# handler in src/index.ts fires on these. https://developers.cloudflare.com/workers/configuration/cron-triggers/
[triggers]
crons = ["0 6 * * *"]

# Observability (logs · traces · issues) — every env inherits this block. Never add an
# [env.<name>.observability] block: it replaces this one. View: dashboard → Worker → Observability.
[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

# Traces: sampled — every request is still in the logs above.
# ponytail: 10% of requests; raise to 1 on a low-traffic site, lower on a busy one.
[observability.traces]
enabled = true
head_sampling_rate = 0.1

# Issues: groups production errors (dashboard → Worker → Issues). Needs Wrangler ≥ 4.134.
[observability.issues]
enabled = true

# ── dev ──────────────────────────────────────────────────────
[env.dev]
name = "indiecrafts-dev-shared-workers"
workers_dev = true

[env.dev.vars]
NEXT_PUBLIC_ENVIRONMENT = "development"

# ── staging ──────────────────────────────────────────────────
[env.staging]
name = "indiecrafts-staging-shared-workers"
workers_dev = true

[env.staging.vars]
NEXT_PUBLIC_ENVIRONMENT = "staging"

# ── prod ─────────────────────────────────────────────────────
[env.prod]
name = "indiecrafts-prod-shared-workers"
workers_dev = false

[env.prod.vars]
NEXT_PUBLIC_ENVIRONMENT = "production"

# ── Bindings & options (queue/background worker — declare PER ENV) ───────
# FULL reference (every binding + placement/limits/DO/AI/…): code/shared/api/wrangler.toml.
# These are per-env (`[[env.<env>.*]]`); shown for prod — repeat for dev/staging.
#
# [[env.prod.queues.consumers]]   # DRAIN the jobs queue (this worker's main job)
# queue = "indiecrafts-prod-jobs"
# max_batch_size = 10
# max_retries = 3
# dead_letter_queue = "indiecrafts-prod-jobs-dlq"
#
# [[env.prod.queues.producers]]   # also enqueue follow-up work
# binding = "JOBS"
# queue = "indiecrafts-prod-jobs"
#
# [[env.prod.kv_namespaces]]      # env.JOBS_KV — dedupe / rate state
# binding = "JOBS_KV"
# id = "<wrangler kv namespace create JOBS_KV>"
#
# [[env.prod.r2_buckets]]         # env.BUCKET — write reports / exports
# binding = "BUCKET"
# bucket_name = "indiecrafts-prod-shared-workers-out"
#
# [[env.prod.services]]           # call the api/cron worker in-process
# binding = "API"
# service = "indiecrafts-prod-shared-api"
#
# Durable Objects (add `[[migrations]]` too — see api reference), [placement]
# mode="smart", [limits] cpu_ms, [[tail_consumers]] all apply here as well.
# Secrets are never in this file — `wrangler secret put <NAME> --env <env>`.
