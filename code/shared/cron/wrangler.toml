# Cloudflare Worker — scheduled / cron (a BARE worker, no Next/OpenNext).
# Deploy: `pnpm deploy:cron:<env>` (→ scripts/deploy/worker.mjs → `wrangler deploy --env <env>`).
# The schedule is the `[triggers] crons` list below (Cloudflare runs it — no HTTP needed).
#
# Names follow `<prefix>-<env>-<platform>-<slug>` (here `indiecrafts-<env>-shared-cron`),
# the single formula in scripts/lib/apps.mjs `resourceName`. `pnpm project:rename <slug>`
# swaps only the `<prefix>`. Do NOT hand-edit the names (a staging/prod deploy is blocked
# until the prefix differs from the template default — shared-account clobber guard).

name = "indiecrafts-dev-shared-cron"
main = "src/index.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]
keep_vars = true
# No public URL anywhere — `POST /run` is reached only through the api's `CRON` service binding.
workers_dev = false
preview_urls = false

# Cron schedule(s) — UTC. Example: hourly. https://crontab.guru
[triggers]
crons = ["0 * * * *"]

# Observability (logs · traces · issues) — every env inherits this block. Never add an
# [env.<name>.observability] block: it replaces this one. View: dashboard → Worker → Observability.
[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

# Traces: sampled — every request is still in the logs above.
# ponytail: 10% of requests; raise to 1 on a low-traffic site, lower on a busy one.
[observability.traces]
enabled = true
head_sampling_rate = 0.1

# Issues: groups production errors (dashboard → Worker → Issues). Needs Wrangler ≥ 4.134.
[observability.issues]
enabled = true

# ── Bindings & options (the ones a scheduled worker usually wants) ───────
# FULL reference (every binding + placement/limits/DO/AI/…): code/shared/api/wrangler.toml.
# Repeat each under `[env.<env>.*]` to differ per env.
#
# [vars]
# DIGEST_HOUR = "6"
# Secrets → `wrangler secret put <NAME> --env <env>` (never in this file).
#
# [[kv_namespaces]]        # env.KV — cursors / last-run markers
# binding = "KV"
# id = "<wrangler kv namespace create KV>"
#
# [[d1_databases]]         # env.DB — read/write app data on a schedule
# binding = "AUDIT_DB"
# database_name = "indiecrafts-dev-shared-cron-audit"
# database_id = "<wrangler d1 create …>"
#
# [[r2_buckets]]           # env.EXPORT_BUCKET — same bucket the api's /v1/export writes
# binding = "EXPORT_BUCKET"                                  # to; the cleanup pass sweeps
# bucket_name = "indiecrafts-dev-shared-api-exports"         # bundles whose TTL expired unread.
#
# [[queues.consumers]]     # a cron worker can also DRAIN a queue (add a queue() handler)
# queue = "indiecrafts-dev-jobs"
# max_batch_size = 10
# dead_letter_queue = "indiecrafts-dev-jobs-dlq"
#
# [[services]]             # call a sibling worker in-process
# binding = "API"
# service = "indiecrafts-dev-shared-api"
#
# [placement]              # run near your DB
# mode = "smart"
# [limits]
# cpu_ms = 50
# upload_source_maps = true

# ── per-env (mirror the deploy scripts) ──────────────────────
# The api's two EU D1s, both bound here read/write so the scheduled passes can enforce
# retention + settings/erasure/export bookkeeping. Same database_ids the api uses (paste
# per env) — see code/shared/api/wrangler.toml for what lives in each:
#   AUDIT_DB — audit firehose: admin_audit · session_events · security_events · csp_reports ·
#             cron_runs (one row per tick — the admin "Scheduled jobs" page).
#   MAIN_DB — identity/rights/settings: consent_events · data_requests · erasure_requests ·
#             export_requests · site_settings.
[env.dev]
name = "indiecrafts-dev-shared-cron"
# No public URL: "Run now" reaches POST /run only through the api's CRON service binding.
workers_dev = false
preview_urls = false

[[env.dev.d1_databases]]
binding = "AUDIT_DB"
database_name = "indiecrafts-dev-db-audit"
database_id = "13e4a91d-ede8-4102-8e9e-010034f6134c"

[[env.dev.d1_databases]]
binding = "MAIN_DB"
database_name = "indiecrafts-dev-db-main"
database_id = "280052ef-726d-43fb-9adb-4821da803627"

# Same bucket the api's POST /v1/export writes to (code/shared/api/wrangler.toml) — the
# export_cleanup pass sweeps bundles that expired unread. Bind it in every env the api does
# (`pnpm test:scripts` → wrangler-parity fails otherwise).
[[env.dev.r2_buckets]]
binding = "EXPORT_BUCKET"
bucket_name = "indiecrafts-dev-shared-api-exports"

[env.staging]
name = "indiecrafts-staging-shared-cron"
# No public URL: "Run now" reaches POST /run only through the api's CRON service binding.
workers_dev = false
preview_urls = false

[[env.staging.d1_databases]]
binding = "AUDIT_DB"
database_name = "indiecrafts-staging-db-audit"
database_id = "PASTE_D1_ID_HERE"

[[env.staging.d1_databases]]
binding = "MAIN_DB"
database_name = "indiecrafts-staging-db-main"
database_id = "PASTE_CORE_D1_ID_HERE"

[env.prod]
name = "indiecrafts-prod-shared-cron"
# No public URL: "Run now" reaches POST /run only through the api's CRON service binding.
workers_dev = false
preview_urls = false

[[env.prod.d1_databases]]
binding = "AUDIT_DB"
database_name = "indiecrafts-prod-db-audit"
database_id = "PASTE_D1_ID_HERE"

[[env.prod.d1_databases]]
binding = "MAIN_DB"
database_name = "indiecrafts-prod-db-main"
database_id = "PASTE_CORE_D1_ID_HERE"
