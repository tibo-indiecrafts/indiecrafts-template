packages:
  # Deployables nest by platform → kind: code/projects/<platform>/<kind>/<app>.
  - code/projects/*/surfaces/*
  - code/projects/*/services/*
  - code/projects/*/tools/*
  - code/shared/*
  # `code/docs` (VitePress) is top-level + npm-isolated (its own lockfile) —
  # it matches none of the globs above, so it stays out of the pnpm workspace.
  # Bricks + modules nest by platform-scope: code/<packages|modules>/<scope>/<name>
  # (scope = shared · web). Reserved scope dirs hold only a
  # README marker (no package.json) and are skipped.
  - code/packages/*/*
  - code/modules/*/*

# pnpm 10 blocks ALL dependency install scripts by default. Allowlist the ones
# that genuinely need to build/download a native binary — without these the tools
# are silently broken after install (esbuild/swc power the bundlers + vitest;
# workerd is the Cloudflare Workers runtime).
onlyBuiltDependencies:
  - "@parcel/watcher"
  - "@swc/core"
  - esbuild
  - workerd
# Deliberately NOT built (silences the warning): sharp degrades to a JS path here,
# unrs-resolver is optional.
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

# Supply-chain hardening (see react-doctor require-pnpm-hardening).
# Wait 3 days before installing a freshly published version, so quickly-unpublished
# malware never reaches the lockfile. (Was 7 days — too long for a large multi-app
# tree: it blocked routine installs on legitimate <7-day-old transitives, e.g.
# storybook→recast, @testing-library. 3 days keeps ~all the protection — malicious
# npm packages are typically caught + unpublished within 24–72h — with far less
# friction. `trustPolicy: no-downgrade` below still catches provenance weakening
# regardless of age.) Value is in MINUTES: 4320 = 3 days.
minimumReleaseAge: 4320
# Fast-moving, trusted vendor toolchains (Cloudflare workerd releases ~daily)
# can't clear a 7-day age gate — and
# blocking them blocks the whole multi-app install. Exempt those scopes; the gate
# still guards the app's OWN dependencies (where malware actually hides).
minimumReleaseAgeExclude:
  # Cloudflare / Workers toolchain (releases ~daily)
  - "@cloudflare/*"
  - "wrangler"
  - "workerd"
  - "@opennextjs/*"
  # High-profile, heavily-watched framework + build + test tooling — the age gate
  # adds little here (these aren't where obscure-package malware hides) and they
  # ship often enough that a 7-day wait blocks routine installs.
  - "next"
  - "@next/*"
  - "sanity"
  - "@sanity/*"
  - "next-sanity"
  # Sanity-org transitives that ride the Studio release cadence: `get-it` (published
  # UNSCOPED) + the PortableText rich-text monorepo (`@portabletext/*`) + `eventsource`
  # (a mature, high-profile SSE lib pulled by @sanity/client; the gate targets obscure
  # malware, not this).
  - "get-it"
  - "@portabletext/*"
  - "eventsource"
  # Sanity i18n plugin — `@sanity/document-internationalization` v6 requires its
  # companion `sanity-plugin-internationalized-array@^5.3.1`, whose only matching
  # release is days old. Rides the Studio release cadence, same as the entries above.
  - "sanity-plugin-internationalized-array"
  - "typescript"
  - "eslint"
  - "@eslint/*"
  - "@typescript-eslint/*"
  - "typescript-eslint"
  - "eslint-config-next"
  - "tailwindcss"
  - "@tailwindcss/*"
  - "vitest"
  - "@vitest/*"
  - "playwright"
  - "playwright-core"
  - "@playwright/*"
  - "@axe-core/*"
  - "@testing-library/*"
# Refuse packages whose provenance/signature trust weakens between
# resolutions (never silently downgrade to a less-trusted source).
trustPolicy: no-downgrade
# Known false positives — types-only / build-tool packages that dropped npm
# provenance attestation without any compromise (a publish-workflow change, not
# a takeover). Exempt them so the policy still guards everything else.
trustPolicyExclude:
  # Individual provenance-gap false positives (types-only / build tools).
  - "undici-types"
  - "semver"
  - "eslint-import-resolver-typescript"
  # Sanity SDK monorepo (@sanity/sdk, @sanity/sdk-react, …) — provenance dropped in a
  # publish-workflow change, not a takeover (verified: published by sanity-svc.npm from
  # github.com/sanity-io/sdk). Pulled in transitively by Studio v6 (`sanity@6.x`).
  - "@sanity/sdk*"
  - "groq"
  - "ua-parser-js"
  # Whole ecosystems with inconsistent npm provenance — the age gate + no-downgrade
  # policy stay ON for the security-critical web RUNTIME tree (next/react/sanity),
  # but these dev/build/legacy toolchains are exempt so the large
  # multi-app install isn't blocked one transitive at a time.
  - "@smithy/*" # AWS SDK core (via @opennextjs/cloudflare)
  - "@aws-sdk/*"

# Single instance of the peer-heavy Sanity Studio packages across the monorepo. Schema +
# structure types cross package boundaries (page-builder/modules → the website Studio), so
# two instances with different peer closures make tsc reject otherwise-identical types. Pin
# the shared set to one version each so every `sanity` resolution collapses to one instance.
overrides:
  sanity: 6.16.0
  "@sanity/vision": 6.16.0
  "@sanity/client": 8.7.0
  "@sanity/ui": 4.2.3
  "@sanity/icons": 5.2.2
  styled-components: 6.5.2
