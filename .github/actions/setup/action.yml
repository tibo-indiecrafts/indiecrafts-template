name: Setup
description:
  pnpm + Node 22 + install the workspace. The repo must already be checked out
  (composite actions load from disk, so `actions/checkout` runs first in the workflow).
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
