# CI — the PR gate. `verify` (types/lint/format/contrast/tests + tooling gates),
# `build` (the real OpenNext Worker build), `csp` (the CSP-enforcement e2e),
# `infra` (terraform validate) and `wrangler` (worker config dry-run) BLOCK;
# `browser` (Storybook a11y + e2e/visual) is advisory until baselines are trusted;
# `docs` builds the VitePress site; `dependency-review` + `secrets-scan` flag risky
# deps / leaked secrets on PRs. React Doctor runs in react-doctor.yml.

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Types + lint + format + WCAG contrast + unit tests + tooling gates. BLOCKING.
  # (React Doctor is the advisory react-doctor.yml; `verify`'s doctor:changed is the
  # local gate, so it's intentionally not duplicated here.)
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm tsc
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm --filter @indiecrafts/web-surfaces-website verify:contrast
      - run: pnpm check:tags
      - run: pnpm lint:scripts
      - run: pnpm test:scripts
      - run: pnpm test

  # The real Cloudflare Worker build (OpenNext) for every AFFECTED Next app
  # (website · admin) — turbo fans out via the `build:cf` task and skips
  # unchanged apps (a docs-only PR builds none). Proves every route prerenders ×
  # locale AND catches CF-only breakage (Shiki WASM, node-compat) before deploy.
  # Needs Sanity read access (blog SSG + sitemap fetch) from repo vars/secrets.
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_CDN_URL: ${{ vars.NEXT_PUBLIC_CDN_URL }} # first-party asset CDN (assetPrefix); empty = origin
      NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID }}
      NEXT_PUBLIC_SANITY_DATASET: ${{ vars.NEXT_PUBLIC_SANITY_DATASET }}
      NEXT_PUBLIC_SANITY_API_VERSION: ${{ vars.NEXT_PUBLIC_SANITY_API_VERSION }}
      SANITY_API_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history so `turbo --affected` can diff against main
      - uses: ./.github/actions/setup
      - run: pnpm exec turbo run build:cf --affected
      # Marketing First-Load JS budget (excludes the Studio). Report-only until
      # BUDGET_KB in scripts/check-bundle-size.mjs is calibrated — then add `--enforce`.
      - run: pnpm --filter @indiecrafts/web-surfaces-website size

  # Browser suites: Storybook stories-as-tests (component + a11y), Playwright e2e +
  # visual regression. ADVISORY (`continue-on-error`) until linux baselines are
  # committed — then drop `continue-on-error` to graduate the gate.
  browser:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:stories # every story as a component + a11y test
      # Visual regression against the built Storybook.
      - run: pnpm --filter @indiecrafts/web-tools-storybook storybook:build
      - run: pnpm --filter @indiecrafts/web-surfaces-website e2e:visual
      # App journeys: global-setup seeds a throwaway `e2e` Sanity dataset, then the
      # webServer builds + serves the app against it. Needs the Sanity secrets.
      - run: pnpm --filter @indiecrafts/web-surfaces-website e2e
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_API_VERSION: "2025-01-01"
          SANITY_API_WRITE_TOKEN: ${{ secrets.SANITY_API_WRITE_TOKEN }}
          E2E_SANITY_DATASET: e2e

  # The CSP-enforcement gate. BLOCKING (unlike the advisory `browser` job): CSP now
  # defaults to enforce, so a broken nonce pipeline would silently break the live site.
  # Runs ONLY the csp-nonce spec (a real browser + built app), proving the strict nonce
  # policy is the enforced header, the nonce reaches the served <script>, nothing is
  # blocked, and /studio keeps its permissive static CSP. Split from `browser` so the
  # untrusted visual baselines stay advisory while this stays a gate. Needs the Sanity
  # secrets (the app build + global-setup seed the throwaway `e2e` dataset).
  csp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --filter @indiecrafts/web-surfaces-website exec playwright test journeys/csp-nonce.spec.ts
        env:
          E2E_TARGET: app
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_API_VERSION: "2025-01-01"
          SANITY_API_WRITE_TOKEN: ${{ secrets.SANITY_API_WRITE_TOKEN }}
          E2E_SANITY_DATASET: e2e

  # The VitePress docs build (catches Vue-parser breaks + structural errors).
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm docs:install
      - run: pnpm docs:build

  # Flags vulnerable / disallowed dependencies added in a PR (GitHub-native).
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/dependency-review-action@v4

  # Terraform for the Cloudflare edge — `fmt` + `validate` on every PR. Creds-free
  # (`init -backend=false`, no CF API call); `plan`/`apply` stay manual (they need
  # CLOUDFLARE_API_TOKEN + state). Catches HCL / provider-schema errors before merge.
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: fmt + validate (website Cloudflare edge)
        working-directory: code/projects/web/surfaces/website/infra/cloudflare
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate

  # Validate each BARE Worker's wrangler.toml + bundle its entry WITHOUT deploying
  # (no Cloudflare auth needed). The next-cf apps (website · admin) are covered by
  # the `build` job (turbo build:cf), so this is just the api · cron · workers slots.
  wrangler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: wrangler deploy --dry-run (api · cron · workers)
        run: |
          for svc in api cron workers; do
            echo "── $svc ──"
            pnpm --filter "@indiecrafts/shared-$svc" exec wrangler deploy --dry-run --outdir "/tmp/$svc-dryrun"
          done

  # Secret scanning — fails the PR if a credential is committed (defence in depth on
  # top of the .gitignore + .gitattributes export-ignore). Scans the PR's commits.
  secrets-scan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history so gitleaks can scan the PR's commit range
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
