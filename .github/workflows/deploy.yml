name: Deploy (Cloudflare)

# Push to main → deploy prod. Use "Run workflow" to target dev/staging/prod.
# One-time setup + required secrets/vars: docs/projects/web/website/setup/deployment.md
on:
  # Prod deploy fires only after CI succeeds on main (see the success gate on
  # the discover job). Manual dispatch stays available for dev/staging/prod.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, staging, prod]
        default: prod

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'prod' }}
  cancel-in-progress: false

jobs:
  # Read the app registry → the Cloudflare apps to deploy (code/shared/scripts/lib/apps.mjs).
  # Adding an app = a row there, no workflow edit.
  discover:
    # workflow_dispatch runs unconditionally; a workflow_run only deploys when CI passed.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      first: ${{ steps.registry.outputs.first }}
      rest: ${{ steps.registry.outputs.rest }}
    steps:
      - uses: actions/checkout@v5
      # Two waves by registry `order`: services another app binds (order < 10 — the cron, which
      # the api's `CRON` service binding needs) deploy first, because a binding to a Worker
      # that doesn't exist yet fails the deploy. Everything else follows.
      - id: registry
        run: |
          apps="$(node code/shared/scripts/lib/apps.mjs --json --cloudflare)"
          echo "first=$(jq -c '[.[] | select(.order < 10)]' <<<"$apps")" >> "$GITHUB_OUTPUT"
          echo "rest=$(jq -c '[.[] | select(.order >= 10)]' <<<"$apps")" >> "$GITHUB_OUTPUT"

  # Manual (workflow_dispatch) deploys skip the CI-success gate, so a dispatch to
  # staging/prod must pass the full suite HERE first. The workflow_run path is already
  # CI-gated, and dev is the fast shared sandbox — both skip this job.
  gate:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment != 'dev' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm verify

  deploy-first:
    needs: [discover, gate]
    # Deploy when discover succeeded AND the gate did not fail (it is skipped on the
    # CI-gated workflow_run path and on a dev dispatch, which is not a failure).
    if: ${{ always() && needs.discover.result == 'success' && needs.gate.result != 'failure' && needs.discover.outputs.first != '[]' }}
    uses: ./.github/workflows/deploy-app.yml
    with:
      apps: ${{ needs.discover.outputs.first }}
      environment: ${{ github.event.inputs.environment || 'prod' }}
    secrets: inherit

  deploy:
    needs: [discover, gate, deploy-first]
    # Runs after the first wave whatever its result: on an existing environment the old cron
    # still satisfies the binding, and on a new one the api's deploy fails loudly anyway.
    if: ${{ always() && needs.discover.result == 'success' && needs.gate.result != 'failure' }}
    uses: ./.github/workflows/deploy-app.yml
    with:
      apps: ${{ needs.discover.outputs.rest }}
      environment: ${{ github.event.inputs.environment || 'prod' }}
    secrets: inherit
