name: Deploy (Cloudflare)

# Manual only: "Run workflow" → pick dev/staging/prod (or `pnpm deploy:*` locally). A push to
# main never deploys. To deploy prod after every green CI run on main, add back:
#   workflow_run: { workflows: ["CI"], types: [completed], branches: [main] }
# One-time setup + required secrets/vars: docs/projects/web/website/setup/deployment.md
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, staging, prod]
        default: prod

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'prod' }}
  cancel-in-progress: false

jobs:
  # Read the app registry → the Cloudflare apps to deploy (code/shared/scripts/lib/apps.mjs).
  # Adding an app = a row there, no workflow edit.
  discover:
    runs-on: ubuntu-latest
    outputs:
      first: ${{ steps.registry.outputs.first }}
      rest: ${{ steps.registry.outputs.rest }}
    steps:
      - uses: actions/checkout@v5
      # Two waves by registry `order`: services another app binds (order < 10 — the cron, which
      # the api's `CRON` service binding needs) deploy first, because a binding to a Worker
      # that doesn't exist yet fails the deploy. Everything else follows.
      - id: registry
        run: |
          apps="$(node code/shared/scripts/lib/apps.mjs --json --cloudflare)"
          echo "first=$(jq -c '[.[] | select(.order < 10)]' <<<"$apps")" >> "$GITHUB_OUTPUT"
          echo "rest=$(jq -c '[.[] | select(.order >= 10)]' <<<"$apps")" >> "$GITHUB_OUTPUT"

  # A deploy to staging/prod must pass the full suite HERE first (as `pnpm deploy:*` does
  # locally); dev is the fast shared sandbox and skips it.
  gate:
    if: ${{ github.event.inputs.environment != 'dev' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm verify

  deploy-first:
    needs: [discover, gate]
    # Deploy when discover succeeded AND the gate did not fail (skipped on a dev deploy,
    # which is not a failure).
    if: ${{ always() && needs.discover.result == 'success' && needs.gate.result != 'failure' && needs.discover.outputs.first != '[]' }}
    uses: ./.github/workflows/deploy-app.yml
    with:
      apps: ${{ needs.discover.outputs.first }}
      environment: ${{ github.event.inputs.environment || 'prod' }}
    secrets: inherit

  deploy:
    needs: [discover, gate, deploy-first]
    # Runs after the first wave whatever its result: on an existing environment the old cron
    # still satisfies the binding, and on a new one the api's deploy fails loudly anyway.
    if: ${{ always() && needs.discover.result == 'success' && needs.gate.result != 'failure' }}
    uses: ./.github/workflows/deploy-app.yml
    with:
      apps: ${{ needs.discover.outputs.rest }}
      environment: ${{ github.event.inputs.environment || 'prod' }}
    secrets: inherit
