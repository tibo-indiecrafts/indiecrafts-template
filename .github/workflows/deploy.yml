name: Deploy (Cloudflare)

# Push to main → deploy prod. Use "Run workflow" to target dev/staging/prod.
# One-time setup + required secrets/vars: docs/apps/web/setup/deployment.md
on:
  # Prod deploy fires only after CI succeeds on main (see the success gate on
  # the discover job). Manual dispatch stays available for dev/staging/prod.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, staging, prod]
        default: prod

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'prod' }}
  cancel-in-progress: false

jobs:
  # Read the app registry → the Cloudflare apps to deploy (code/shared/scripts/lib/apps.mjs).
  # Adding an app = a row there, no workflow edit.
  discover:
    # workflow_dispatch runs unconditionally; a workflow_run only deploys when CI passed.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.registry.outputs.apps }}
    steps:
      - uses: actions/checkout@v5
      - id: registry
        run: echo "apps=$(node code/shared/scripts/lib/apps.mjs --json --cloudflare)" >> "$GITHUB_OUTPUT"

  # Manual (workflow_dispatch) deploys skip the CI-success gate, so a dispatch to
  # staging/prod must pass the full suite HERE first. The workflow_run path is already
  # CI-gated, and dev is the fast shared sandbox — both skip this job.
  gate:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment != 'dev' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm verify

  deploy:
    needs: [discover, gate]
    # Deploy when discover succeeded AND the gate did not fail (it is skipped on the
    # CI-gated workflow_run path and on a dev dispatch, which is not a failure).
    if: ${{ always() && needs.discover.result == 'success' && needs.gate.result != 'failure' }}
    runs-on: ubuntu-latest
    # GitHub Environment — holds the per-target vars + secrets below.
    environment: ${{ github.event.inputs.environment || 'prod' }}
    strategy:
      fail-fast: false # one app failing shouldn't abort the others
      matrix:
        app: ${{ fromJson(needs.discover.outputs.apps) }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      # Each app self-deploys via its registry `deploy:<platform>:<slug>:<env>` script (a
      # next-cf app builds with OpenNext, a worker just `wrangler deploy`s). Apps deploy in
      # parallel — CF workers are independent (service bindings resolve at runtime).
      - run: pnpm run deploy:${{ matrix.app.platform }}:${{ matrix.app.slug }}:${{ github.event.inputs.environment || 'prod' }}
        env:
          # Cloudflare auth — account-scoped API token with Workers + R2 edit.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Build-time env (blog generateStaticParams / sitemap fetch Sanity).
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          # First-party asset CDN — set this per-env GitHub Environment var to bake
          # `assetPrefix` for that env. Empty = serve from origin. (Sanity content unaffected.)
          NEXT_PUBLIC_CDN_URL: ${{ vars.NEXT_PUBLIC_CDN_URL }}
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ vars.NEXT_PUBLIC_SANITY_DATASET }}
          NEXT_PUBLIC_SANITY_API_VERSION: ${{ vars.NEXT_PUBLIC_SANITY_API_VERSION }}
          SANITY_API_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN }}
          # Worker runtime secrets → auto-synced to Cloudflare AFTER deploy by
          # scripts/data/secrets.mjs (each app syncs only the keys its OWN
          # `.dev.vars.example` declares, so injecting the union here is safe — an
          # unused var is ignored). Add each to the matching GitHub Environment
          # (dev/staging/prod) Secrets — per-env, so GDPR_FINGERPRINT_SALT stays
          # DISTINCT per env. Empty/unset → secrets.mjs skips it (nothing synced).
          APP_API_TOKEN: ${{ secrets.APP_API_TOKEN }}
          PII_ENCRYPTION_KEY: ${{ secrets.PII_ENCRYPTION_KEY }}
          IP_HASH_SALT: ${{ secrets.IP_HASH_SALT }}
          GDPR_FINGERPRINT_SALT: ${{ secrets.GDPR_FINGERPRINT_SALT }}
          CLERK_WEBHOOK_SECRET: ${{ secrets.CLERK_WEBHOOK_SECRET }}
          EMAIL_PREF_SECRET: ${{ secrets.EMAIL_PREF_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

      # Post-deploy smoke test — best-effort. Curls the app's custom-domain origin
      # from the registry (`domains:url`); if the app/env has no custom domain (still
      # on *.workers.dev, whose URL isn't in the registry), it's skipped. Once a real
      # host is set, a failed fetch fails the deploy so a broken ship is caught here.
      # An app that declares a `smoke` route in the registry (apps.mjs) also gets a
      # FUNCTIONAL probe: the health/version endpoint must return the expected marker,
      # proving the runtime + the freshly deployed build are live (not just a 200 edge).
      - name: Smoke test
        id: smoke
        env:
          SMOKE_PATH: ${{ matrix.app.smoke.path }}
          SMOKE_CONTAINS: ${{ matrix.app.smoke.contains }}
        run: |
          env="${{ github.event.inputs.environment || 'prod' }}"
          url="$(pnpm -s domains:url ${{ matrix.app.slug }} "$env" || true)"
          if [ -z "$url" ]; then
            echo "No custom-domain origin for ${{ matrix.app.slug }} ($env) — skipping (workers.dev URL not in the registry)."
            exit 0
          fi
          echo "Smoke: GET $url"
          curl -fsS --retry 3 --retry-delay 5 -o /dev/null "$url"
          echo "✓ ${{ matrix.app.slug }} ($env) reachable at $url"
          # Functional probe for apps that declare a health/version route in the registry.
          if [ -n "$SMOKE_PATH" ]; then
            echo "Smoke: GET $url$SMOKE_PATH (expect \"$SMOKE_CONTAINS\")"
            body="$(curl -fsS --retry 3 --retry-delay 5 "$url$SMOKE_PATH")"
            if printf '%s' "$body" | grep -qF "$SMOKE_CONTAINS"; then
              echo "✓ ${{ matrix.app.slug }} ($env) functional — $SMOKE_PATH returned \"$SMOKE_CONTAINS\""
            else
              echo "✗ ${{ matrix.app.slug }} ($env): $SMOKE_PATH did not contain \"$SMOKE_CONTAINS\". Body: $body" >&2
              exit 1
            fi
          fi

      # Auto-rollback — ONLY when the deploy SUCCEEDED but its post-deploy smoke FAILED
      # (a broken runtime or stale build shipped). `steps.smoke.outcome == 'failure'` is
      # false when the deploy step itself failed (smoke is skipped then — nothing new is
      # live to revert), so a broken deploy is left as-is for a human. `wrangler rollback`
      # with no version-id reverts to the version before the latest; `--message` makes it
      # non-interactive (skips the confirmation prompt). Works for every Cloudflare app —
      # the next-cf apps deploy a Worker too, so the same rollback applies.
      - name: Rollback on smoke failure
        if: steps.smoke.outcome == 'failure'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          env="${{ github.event.inputs.environment || 'prod' }}"
          echo "Post-deploy smoke failed — rolling ${{ matrix.app.slug }} ($env) back to the previous version."
          pnpm --filter "${{ matrix.app.pkg }}" exec wrangler rollback \
            --env "$env" \
            --message "auto-rollback: post-deploy smoke failed (run ${{ github.run_id }})"
