name: Deploy (native — mobile)

# The native surface ships OUTSIDE the Cloudflare deploy.yml: it needs store credentials
# and a remote build (EAS). Manual dispatch only — pick the env. CI sets CI=true, so the
# prod confirm auto-skips.
#
# NOTE: the git remote is GitLab; these GitHub Actions run only if the repo is also on
# GitHub (mirror or move). On GitLab CI, port this job to `.gitlab-ci.yml`.
#
# Required GitHub Environment secrets/vars (per env):
#   Mobile — EXPO_TOKEN (EAS). Store submit creds live in eas.json.
#   var SITE_PREFIX — the resource-name prefix (default `indiecrafts`).
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, staging, prod]
        default: prod

concurrency:
  group: deploy-native-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  # Mobile (Expo) — EAS Build (+ submit on prod). One Linux runner; EAS builds remotely.
  mobile:
    environment: ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: npm install -g eas-cli
      - run: pnpm deploy:mobile:main:"$ENVIRONMENT" --yes
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
