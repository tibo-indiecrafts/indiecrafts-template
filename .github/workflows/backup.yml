name: Backup (Cloudflare)

# Scheduled dump of the Sanity dataset (+ D1 if configured) to the per-env R2
# backups bucket. Manual: "Run workflow" → pick the env. The scripts prune LOCAL
# copies to the last 10; rotate the R2 copies with a bucket lifecycle rule.
# Hub-scoped by design: one Sanity dataset per tenant, and the hub Studio (on `web`)
# holds the write token + all content — so backup is NOT a per-app fan-out.
# Setup + rotation: docs/projects/web/website/setup/backups.md
on:
  schedule:
    - cron: "0 3 * * *" # daily 03:00 UTC (prod)
  workflow_dispatch:
    inputs:
      environment:
        description: Which env's R2 bucket to store into
        type: choice
        options: [prod, staging, dev]
        default: prod

concurrency:
  group: backup-${{ github.event.inputs.environment || 'prod' }}
  cancel-in-progress: false

jobs:
  backup:
    # The schedule is off until the repo variable BACKUP_ENABLED is "true" (Settings → Variables)
    # and the CLOUDFLARE_* + Sanity secrets below exist. "Run workflow" always runs.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.BACKUP_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'prod' }}
    env:
      ENV: ${{ github.event.inputs.environment || 'prod' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID }}
      NEXT_PUBLIC_SANITY_DATASET: ${{ vars.NEXT_PUBLIC_SANITY_DATASET }}
      SANITY_API_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      # Registry-driven: backs up every db in code/shared/scripts/lib/databases.mjs, dispatching
      # on kind (sanity → dataset export, d1 → wrangler export, others reserved). The
      # runner puts each owner's node_modules/.bin (sanity + wrangler CLIs) on PATH and
      # reads config from the job env above (no .env.local in CI).
      - name: Back up all databases → R2
        run: node code/shared/scripts/data/backup.mjs --all "$ENV" --remote ${{ github.event_name == 'schedule' && '--kind=scheduled' || '' }}
