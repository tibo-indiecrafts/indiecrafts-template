name: Preview (Cloudflare)

# Per-PR preview: build with OpenNext + `wrangler versions upload` (a Cloudflare
# version PREVIEW URL — does not touch the deployed prod/dev worker), then comment
# the link. Same-repo PRs only (forks don't receive secrets). Needs the same
# CLOUDFLARE_* + Sanity vars/secrets as deploy. See setup/deployment.md.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # The Next apps to preview come from the registry (next-cf class). Same-repo PRs
  # only — forks don't receive secrets.
  discover:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.registry.outputs.apps }}
    steps:
      - uses: actions/checkout@v5
      - id: registry
        run: echo "apps=$(node code/shared/scripts/lib/apps.mjs --json --class next-cf)" >> "$GITHUB_OUTPUT"

  preview:
    needs: discover
    runs-on: ubuntu-latest
    environment: dev
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.discover.outputs.apps) }}
    defaults:
      run:
        working-directory: ${{ matrix.app.dir }}
    env:
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_CDN_URL: ${{ vars.NEXT_PUBLIC_CDN_URL }} # first-party asset CDN (assetPrefix); empty = origin
      NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID }}
      NEXT_PUBLIC_SANITY_DATASET: ${{ vars.NEXT_PUBLIC_SANITY_DATASET }}
      NEXT_PUBLIC_SANITY_API_VERSION: ${{ vars.NEXT_PUBLIC_SANITY_API_VERSION }}
      SANITY_API_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        working-directory: .
      - name: Build (OpenNext)
        run: pnpm build:cf
      - name: Upload preview version
        id: preview
        run: |
          set -o pipefail
          out=$(pnpm exec wrangler versions upload --env dev --message "PR #${{ github.event.pull_request.number }} (${{ matrix.app.slug }})" 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          url=$(echo "$out" | grep -oE 'https://[a-z0-9.-]+workers\.dev' | tail -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Comment the preview URL
        if: steps.preview.outputs.url != ''
        uses: actions/github-script@v7
        with:
          script: |
            const app = "${{ matrix.app.slug }}";
            const url = "${{ steps.preview.outputs.url }}";
            const marker = `<!-- cf-preview-${app} -->`;
            const body = `${marker}\n🔎 **Preview (${app}):** ${url}\n\n_Cloudflare version preview — not the live worker. Updates on each push._`;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number });
            const mine = comments.find((c) => c.body?.includes(marker));
            if (mine) await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
